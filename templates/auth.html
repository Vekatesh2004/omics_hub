<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omics Hub - Authentication</title>
    <!-- Primary Flask CSS Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Embedded Styles -->
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; }
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }
        .auth-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 420px; padding: 36px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .brand-header { text-align: center; margin-bottom: 28px; }
        .brand-header h1 { color: #38bdf8; font-size: 28px; font-weight: 800; }
        .brand-header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }
        .tab-group { display: flex; background: #0f172a; padding: 4px; border-radius: 8px; margin-bottom: 24px; }
        .tab-btn { flex: 1; padding: 10px 0; text-align: center; background: transparent; border: none; color: #94a3b8; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .submit-btn { width: 100%; padding: 12px; background: #0284c7; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #0369a1; }
        .error-msg { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; text-align: center; }
        .auth-link { color: #38bdf8; font-size: 13px; text-decoration: none; }
        .auth-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-header">
                <h1>OMICS HUB</h1>
                <p>Training & Development Portal</p>
            </div>

            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <!-- Dynamic JS Error Box for Password Matching -->
            <div id="js-error" class="error-msg" style="display: none;"></div>

            <div class="tab-group">
                <button type="button" class="tab-btn {% if active_tab != 'register' %}active{% endif %}" onclick="showTab('login')">Login</button>
                <button type="button" class="tab-btn {% if active_tab == 'register' %}active{% endif %}" onclick="showTab('register')">Register</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" method="POST" action="/auth" style="{% if active_tab == 'register' %}display: none;{% endif %}">
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                    <div style="text-align: right; margin-top: 6px;">
                        <a href="/forgot_password" class="auth-link">Forgot Password?</a>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Sign In to Dashboard</button>
            </form>

            <!-- REGISTER FORM WITH CONFIRM PASSWORD & VALIDATION -->
            <form id="register-form" method="POST" action="/auth" onsubmit="return validateRegistration(event)" style="{% if active_tab != 'register' %}display: none;{% endif %}">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@domain.com" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="reg-confirm-password" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="submit-btn">Register & Open Training</button>
            </form>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabs = document.querySelectorAll('.tab-btn');
            const jsError = document.getElementById('js-error');

            jsError.style.display = 'none';

            if (tabName === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
        }

        function validateRegistration(event) {
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const jsError = document.getElementById('js-error');

            if (password !== confirmPassword) {
                jsError.textContent = 'Passwords do not match!';
                jsError.style.display = 'block';
                event.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
